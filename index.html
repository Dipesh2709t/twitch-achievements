<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Twitch Achievements</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 15px;
    background: #0e0e10;
    color: white;
    font-family: Arial, sans-serif;
}

.container {
    max-width: 850px;
    margin: auto;
}

.header {
    background: #18181b;
    border-radius: 15px;
    padding: 20px;
    margin-bottom: 15px;
}

h1 {
    margin: 0 0 8px;
}

.subtitle {
    color: #aaa;
}

.stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-top: 18px;
}

.stat {
    background: #27272a;
    padding: 15px;
    border-radius: 10px;
    text-align: center;
}

.number {
    font-size: 23px;
    font-weight: bold;
}

.label {
    color: #aaa;
    font-size: 13px;
    margin-top: 4px;
}

.achievement {
    background: #18181b;
    border-radius: 12px;
    padding: 15px;
    margin-bottom: 10px;
}

.completed {
    border-left: 5px solid #9147ff;
}

.locked {
    border-left: 5px solid #444;
    opacity: .55;
}

.title {
    font-size: 17px;
    font-weight: bold;
}

.description {
    color: #aaa;
    margin-top: 5px;
}

.badge {
    color: #9147ff;
    font-size: 12px;
    margin-left: 7px;
}

.loading {
    text-align: center;
    padding: 40px;
    color: #aaa;
}

.error {
    background: #3b1616;
    padding: 20px;
    border-radius: 10px;
    color: #ff8a8a;
}

@media (max-width: 600px) {

    body {
        padding: 10px;
    }

    .stats {
        grid-template-columns: 1fr;
    }

    .header {
        padding: 16px;
    }

}

</style>
</head>

<body>

<div class="container">

<div class="header">

<h1 id="username">
🏆 Achievements
</h1>

<div class="subtitle">
Twitch Economy Achievement Profile
</div>

<div class="stats">

<div class="stat">
<div class="number" id="completed">-</div>
<div class="label">Completed</div>
</div>

<div class="stat">
<div class="number" id="rank">-</div>
<div class="label">Achievement Rank</div>
</div>

<div class="stat">
<div class="number" id="percentage">-</div>
<div class="label">Completion</div>
</div>

</div>

</div>

<div id="content">

<div class="loading">
Loading achievements...
</div>

</div>

</div>


<script>

/*
YOUR APPS SCRIPT API
*/

const API =
"https://script.google.com/macros/s/AKfycbyR4bHCR53b_YaZ-JWMXUkYfz4knsp2jVMaA2vceFEGnv0PMjsVYW3euc_jyMvhHPkY/exec";


/*
30 ACHIEVEMENTS
*/

const achievements = [

["First Paycheck","Use !work once."],
["Part-Time Employee","Use !work 25 times."],
["Full-Time Employee","Use !work 100 times."],
["Work Machine","Use !work 250 times."],
["Workaholic","Use !work 500 times."],
["Corporate Slave","Use !work 1,000 times."],

["Overtime","Earn $1,000 from !work."],
["Career Employee","Earn $5,000 from !work."],
["Workaholic Deluxe","Earn $10,000 from !work."],

["First Scam","Successfully scam someone."],
["Rookie Scammer","Successfully scam 10 people."],
["Con Artist","Successfully scam 25 people."],
["Scam Factory","Successfully scam 100 people."],
["Professional Criminal","Successfully scam 250 people."],

["Dirty Business","Steal $1,000 through scams."],
["Scam Tycoon","Steal $10,000 through scams."],

["Big Score","Successfully scam $100 in one attempt."],

["Caught in 4K","Get reported once."],
["Repeat Offender","Get reported 10 times."],
["Public Enemy","Get reported 50 times."],

["Rock Bottom","Reach a negative balance."],
["Comeback Kid","Recover from negative balance to $200+."],

["Getting Rich","Reach $500."],
["Big Money","Reach $1,000."],
["High Roller","Reach $5,000."],

["Top 5","Reach the top 5."],
["Money King","Reach #1."],

["Lucky Worker","Receive a $50 lucky payout."],
["Very Lucky","Receive a $100 lucky payout."],
["Jackpot!","Hit the $150 work jackpot."]

];


/*
GET USER FROM URL
*/

const params =
new URLSearchParams(
window.location.search
);

const user =
(
params.get("user") ||
"test"
)
.toLowerCase();


/*
LOAD DATA
*/

async function loadData() {

    try {

        const url =
            API +
            "?action=player&user=" +
            encodeURIComponent(user);


        const response =
            await fetch(url);


        if (!response.ok) {

            throw new Error(
                "API returned " +
                response.status
            );

        }


        const data =
            await response.json();


        console.log(
            "API DATA:",
            data
        );


        if (data.error) {

            throw new Error(
                data.error
            );

        }


        display(data);

    }

    catch(error) {

        console.error(error);

        document.getElementById(
            "content"
        ).innerHTML =

        "<div class='error'>" +

        "❌ Could not load achievement data.<br><br>" +

        error.message +

        "</div>";

    }

}


/*
DISPLAY DATA
*/

function display(data) {

    const completed =
        Number(
            data.completed || 0
        );


    const total =
        Number(
            data.total ||
            achievements.length
        );


    const rank =
        data.rank ||
        "-";


    document.getElementById(
        "username"
    ).textContent =

    "🏆 " +
    data.username +
    "'s Achievements";


    document.getElementById(
        "completed"
    ).textContent =

    completed +
    "/" +
    total;


    document.getElementById(
        "rank"
    ).textContent =

    rank === "-"
        ? "-"
        : "#" + rank;


    document.getElementById(
        "percentage"
    ).textContent =

    Math.round(
        (completed / total) *
        100
    ) + "%";


    const states =
        data.achievements || [];


    let html = "";


    achievements.forEach(
        function(achievement, i) {

            const unlocked =
                states[i] === true;


            html +=

            "<div class='achievement " +

            (
                unlocked
                    ? "completed"
                    : "locked"
            ) +

            "'>" +

            "<div class='title'>" +

            (
                unlocked
                    ? "✅ "
                    : "🔒 "
            ) +

            achievement[0] +

            (
                unlocked
                    ? "<span class='badge'>COMPLETED</span>"
                    : ""
            ) +

            "</div>" +

            "<div class='description'>" +

            achievement[1] +

            "</div>" +

            "</div>";

        }
    );


    document.getElementById(
        "content"
    ).innerHTML =
        html;

}


loadData();

</script>

</body>
</html>
