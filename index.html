<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Twitch Achievements</title>

<style>

/* =====================================================
   BASE
===================================================== */

* {
  box-sizing: border-box;
}

body {

  margin: 0;

  min-height: 100vh;

  font-family:
    Inter,
    Arial,
    sans-serif;

  color: #ffffff;

  background:
    radial-gradient(
      circle at top,
      #24114f 0%,
      #120a24 45%,
      #080510 100%
    );

}


/* =====================================================
   CONTAINER
===================================================== */

.container {

  width: min(
    1100px,
    calc(100% - 30px)
  );

  margin: auto;

  padding: 40px 0 70px;

}


/* =====================================================
   HEADER
===================================================== */

.header {

  text-align: center;

  margin-bottom: 35px;

}

.logo {

  font-size: 48px;

  margin-bottom: 8px;

}

h1 {

  margin: 0;

  font-size: 38px;

}

.subtitle {

  margin-top: 10px;

  color: #aaa3bb;

}


/* =====================================================
   SEARCH
===================================================== */

.search-box {

  display: flex;

  gap: 10px;

  max-width: 650px;

  margin: 30px auto;

}

.search-box input {

  flex: 1;

  padding: 16px 18px;

  border-radius: 12px;

  border: 1px solid #3b2b55;

  background: #130d20;

  color: white;

  font-size: 16px;

  outline: none;

}

.search-box input:focus {

  border-color: #9147ff;

  box-shadow:
    0 0 0 3px
    rgba(145,71,255,.15);

}

.search-box button {

  border: 0;

  border-radius: 12px;

  padding: 0 25px;

  background: #9147ff;

  color: white;

  font-weight: bold;

  font-size: 16px;

  cursor: pointer;

}

.search-box button:hover {

  background: #a970ff;

}


/* =====================================================
   PROFILE
===================================================== */

.profile {

  display: none;

}

.profile.active {

  display: block;

}


.profile-card {

  background:
    linear-gradient(
      145deg,
      rgba(145,71,255,.18),
      rgba(20,12,35,.9)
    );

  border: 1px solid #392651;

  border-radius: 20px;

  padding: 28px;

  margin-bottom: 25px;

  box-shadow:
    0 15px 50px
    rgba(0,0,0,.25);

}

.profile-name {

  font-size: 30px;

  font-weight: 800;

  margin-bottom: 20px;

}


/* =====================================================
   STATS
===================================================== */

.stats {

  display: grid;

  grid-template-columns:
    repeat(
      3,
      1fr
    );

  gap: 15px;

}


.stat {

  background: #120b1d;

  border: 1px solid #30203f;

  border-radius: 14px;

  padding: 18px;

}

.stat-label {

  color: #9991a9;

  font-size: 13px;

  margin-bottom: 7px;

}

.stat-value {

  font-size: 24px;

  font-weight: 800;

}


/* =====================================================
   OVERALL PROGRESS
===================================================== */

.summary {

  margin-top: 25px;

}

.summary-top {

  display: flex;

  justify-content: space-between;

  margin-bottom: 9px;

  color: #cfc8d8;

}

.progress {

  height: 12px;

  background: #21162d;

  border-radius: 20px;

  overflow: hidden;

}

.progress-bar {

  height: 100%;

  background:
    linear-gradient(
      90deg,
      #9147ff,
      #c084ff
    );

  border-radius: 20px;

  transition:
    width .5s ease;

}


/* =====================================================
   FILTERS
===================================================== */

.filters {

  display: flex;

  gap: 10px;

  margin: 25px 0;

  flex-wrap: wrap;

}

.filter {

  border: 1px solid #3b2b55;

  background: #120b1d;

  color: #bbb2c8;

  padding: 9px 15px;

  border-radius: 20px;

  cursor: pointer;

}

.filter.active {

  background: #9147ff;

  color: white;

  border-color: #9147ff;

}


/* =====================================================
   ACHIEVEMENTS
===================================================== */

.achievements {

  display: grid;

  grid-template-columns:
    repeat(
      2,
      1fr
    );

  gap: 15px;

}

.achievement {

  background: #120b1d;

  border: 1px solid #30203f;

  border-radius: 16px;

  padding: 20px;

  transition:
    transform .15s,
    border-color .15s;

}

.achievement:hover {

  transform:
    translateY(-2px);

  border-color: #614187;

}

.achievement.completed {

  border-color:
    rgba(
      145,
      71,
      255,
      .6
    );

  background:
    linear-gradient(
      145deg,
      rgba(145,71,255,.13),
      #120b1d
    );

}

.achievement-title {

  display: flex;

  align-items: center;

  gap: 10px;

  font-size: 18px;

  font-weight: 700;

}

.achievement-icon {

  font-size: 23px;

}

.achievement-description {

  color: #9d95a8;

  margin: 9px 0 15px;

  font-size: 14px;

  line-height: 1.5;

}

.achievement-progress {

  display: flex;

  justify-content: space-between;

  font-size: 13px;

  color: #aaa2b5;

  margin-bottom: 7px;

}

.achievement-progress-bar {

  height: 8px;

  background: #21162d;

  border-radius: 20px;

  overflow: hidden;

}

.achievement-progress-fill {

  height: 100%;

  background: #9147ff;

  border-radius: 20px;

}

.achievement.completed
.achievement-progress-fill {

  background:
    linear-gradient(
      90deg,
      #7b35d9,
      #b66cff
    );

}


/* =====================================================
   LOADING / ERROR
===================================================== */

.message {

  text-align: center;

  color: #aaa3b0;

  padding: 40px;

}

.error {

  color: #ff6b81;

}


/* =====================================================
   FOOTER
===================================================== */

.footer {

  text-align: center;

  color: #625b6b;

  margin-top: 50px;

  font-size: 13px;

}


/* =====================================================
   MOBILE
===================================================== */

@media (
  max-width: 700px
) {

  .container {

    padding-top: 25px;

  }

  h1 {

    font-size: 30px;

  }

  .logo {

    font-size: 38px;

  }

  .search-box {

    flex-direction: column;

  }

  .search-box button {

    padding: 14px;

  }

  .stats {

    grid-template-columns:
      1fr;

  }

  .achievements {

    grid-template-columns:
      1fr;

  }

}

</style>

</head>


<body>

<div class="container">


  <!-- HEADER -->

  <div class="header">

    <div class="logo">
      🏆
    </div>

    <h1>
      Twitch Achievements
    </h1>

    <div class="subtitle">
      Track your economy progress
    </div>

  </div>


  <!-- SEARCH -->

  <div class="search-box">

    <input
      id="usernameInput"
      type="text"
      placeholder="Search Twitch username..."
      autocomplete="off"
    >

    <button
      onclick="searchPlayer()"
    >
      Search
    </button>

  </div>


  <div
    id="message"
    class="message"
  >
    Search for a Twitch username to view achievements.
  </div>


  <!-- PROFILE -->

  <div
    id="profile"
    class="profile"
  >

    <div class="profile-card">

      <div
        id="profileName"
        class="profile-name"
      ></div>


      <div class="stats">

        <div class="stat">

          <div class="stat-label">
            BALANCE
          </div>

          <div
            id="balance"
            class="stat-value"
          >
            $0
          </div>

        </div>


        <div class="stat">

          <div class="stat-label">
            MONEY RANK
          </div>

          <div
            id="moneyRank"
            class="stat-value"
          >
            #-
          </div>

        </div>


        <div class="stat">

          <div class="stat-label">
            ACHIEVEMENTS
          </div>

          <div
            id="achievementCount"
            class="stat-value"
          >
            0/0
          </div>

        </div>

      </div>


      <div class="summary">

        <div class="summary-top">

          <span>
            Overall Progress
          </span>

          <span
            id="percentage"
          >
            0%
          </span>

        </div>

        <div class="progress">

          <div
            id="overallBar"
            class="progress-bar"
            style="width:0%"
          ></div>

        </div>

      </div>

    </div>


    <!-- FILTERS -->

    <div class="filters">

      <button
        class="filter active"
        data-filter="all"
        onclick="setFilter('all', this)"
      >
        All
      </button>

      <button
        class="filter"
        data-filter="completed"
        onclick="setFilter('completed', this)"
      >
        Completed
      </button>

      <button
        class="filter"
        data-filter="progress"
        onclick="setFilter('progress', this)"
      >
        In Progress
      </button>

      <button
        class="filter"
        data-filter="locked"
        onclick="setFilter('locked', this)"
      >
        Locked
      </button>

    </div>


    <!-- ACHIEVEMENTS -->

    <div
      id="achievements"
      class="achievements"
    ></div>

  </div>


  <div class="footer">
    Twitch Economy • Achievement Dashboard
  </div>

</div>


<script>

/* =====================================================
   APPS SCRIPT API
===================================================== */

const API_URL =
  "https://script.google.com/macros/s/AKfycbyR4bHCR53b_YaZ-JWMXUkYfz4knsp2jVMaA2vceFEGnv0PMjsVYW3euc_jyMvhHPkY/exec";


/* =====================================================
   STATE
===================================================== */

let currentPlayer = null;

let currentFilter = "all";


/* =====================================================
   FORMAT MONEY
===================================================== */

function money(value) {

  return "$" +
    Number(
      value || 0
    ).toLocaleString();

}


/* =====================================================
   SEARCH PLAYER
===================================================== */

function searchPlayer() {

  const input =
    document.getElementById(
      "usernameInput"
    );


  const username =
    input.value
      .trim()
      .toLowerCase();


  if (!username) {

    showMessage(
      "Enter a Twitch username.",
      true
    );

    return;

  }


  loadPlayer(
    username
  );

}


/* =====================================================
   ENTER KEY
===================================================== */

document
  .getElementById(
    "usernameInput"
  )
  .addEventListener(
    "keydown",
    function(event) {

      if (
        event.key ===
        "Enter"
      ) {

        searchPlayer();

      }

    }
  );


/* =====================================================
   LOAD PLAYER
===================================================== */

async function loadPlayer(
  username
) {

  showMessage(
    "Loading achievements..."
  );


  document
    .getElementById(
      "profile"
    )
    .classList
    .remove("active");


  try {

    /*
       IMPORTANT:
       The Apps Script endpoint is
       action=player, NOT action=profile.
    */

    const response =
      await fetch(

        API_URL +
        "?action=player&user=" +
        encodeURIComponent(
          username
        )

      );


    if (!response.ok) {

      throw new Error(
        "API request failed: HTTP " +
        response.status
      );

    }


    const data =
      await response.json();


    if (data.error) {

      throw new Error(
        data.error
      );

    }


    currentPlayer =
      data;


    /*
       Make profile shareable:

       yoursite.com/?user=username
    */

    const newUrl =
      window.location.pathname +
      "?user=" +
      encodeURIComponent(
        username
      );


    window.history
      .replaceState(
        {},
        "",
        newUrl
      );


    currentFilter =
      "all";


    document
      .querySelectorAll(
        ".filter"
      )
      .forEach(
        function(button) {

          button
            .classList
            .remove(
              "active"
            );

        }
      );


    const allButton =
      document.querySelector(
        '[data-filter="all"]'
      );


    if (allButton) {

      allButton
        .classList
        .add(
          "active"
        );

    }


    renderPlayer();

  }

  catch (error) {

    console.error(
      error
    );


    showMessage(
      error.message ||
      "Could not load player.",
      true
    );

  }

}


/* =====================================================
   RENDER PLAYER
===================================================== */

function renderPlayer() {

  if (!currentPlayer) {
    return;
  }


  document
    .getElementById(
      "message"
    )
    .style
    .display =
      "none";


  document
    .getElementById(
      "profile"
    )
    .classList
    .add("active");


  document
    .getElementById(
      "profileName"
    )
    .textContent =
      "@" +
      currentPlayer.username;


  document
    .getElementById(
      "balance"
    )
    .textContent =
      money(
        currentPlayer.balance
      );


  document
    .getElementById(
      "moneyRank"
    )
    .textContent =
      "#" +
      currentPlayer.moneyRank;


  /*
     NEW API FIELD:
     completed
  */

  const completed =
    Number(
      currentPlayer.completed ||
      0
    );


  const total =
    Number(
      currentPlayer.totalAchievements ||
      0
    );


  document
    .getElementById(
      "achievementCount"
    )
    .textContent =
      completed +
      "/" +
      total;


  const percentage =
    total
      ? Math.round(
          (
            completed /
            total
          ) * 100
        )
      : 0;


  document
    .getElementById(
      "percentage"
    )
    .textContent =
      percentage +
      "%";


  document
    .getElementById(
      "overallBar"
    )
    .style
    .width =
      percentage +
      "%";


  renderAchievements();

}


/* =====================================================
   RENDER ACHIEVEMENTS
===================================================== */

function renderAchievements() {

  const container =
    document.getElementById(
      "achievements"
    );


  container.innerHTML =
    "";


  if (
    !currentPlayer ||
    !Array.isArray(
      currentPlayer.achievements
    )
  ) {

    container.innerHTML = `
      <div class="message error">
        No achievement data found.
      </div>
    `;

    return;

  }


  const achievements =
    currentPlayer.achievements;


  for (
    let i = 0;
    i < achievements.length;
    i++
  ) {

    const achievement =
      achievements[i];


    const completed =
      Boolean(
        achievement.completed
      );


    const progress =
      Number(
        achievement.progress
      ) || 0;


    const goal =
      Number(
        achievement.goal
      ) || 1;


    const percent =
      Math.min(
        100,
        Math.round(
          (
            progress /
            goal
          ) * 100
        )
      );


    /*
       FILTER
    */

    let filterMatch =
      true;


    if (
      currentFilter ===
      "completed"
    ) {

      filterMatch =
        completed;

    }


    else if (
      currentFilter ===
      "progress"
    ) {

      filterMatch =
        !completed &&
        progress > 0;

    }


    else if (
      currentFilter ===
      "locked"
    ) {

      filterMatch =
        !completed &&
        progress === 0;

    }


    if (!filterMatch) {
      continue;
    }


    const card =
      document.createElement(
        "div"
      );


    card.className =
      "achievement" +
      (
        completed
          ? " completed"
          : ""
      );


    let icon =
      completed
        ? "🏆"
        : progress > 0
          ? "🔄"
          : "🔒";


    let progressText;


    /*
       MONEY ACHIEVEMENTS
    */

    if (

      achievement.type ===
        "workmoney" ||

      achievement.type ===
        "scammoney" ||

      achievement.type ===
        "highest" ||

      achievement.type ===
        "bigscore"

    ) {

      progressText =
        money(progress) +
        " / " +
        money(goal);

    }


    /*
       RANK ACHIEVEMENTS
    */

    else if (
      achievement.type ===
      "rank"
    ) {

      if (completed) {

        progressText =
          "Top " +
          goal +
          " ✓";

      }

      else {

        progressText =
          "Current rank #" +
          currentPlayer.moneyRank +
          " • Need Top " +
          goal;

      }

    }


    /*
       NORMAL ACHIEVEMENTS
    */

    else {

      progressText =
        progress +
        " / " +
        goal;

    }


    card.innerHTML = `

      <div class="achievement-title">

        <span class="achievement-icon">
          ${icon}
        </span>

        <span>
          ${escapeHtml(
            achievement.name
          )}
        </span>

      </div>


      <div class="achievement-description">

        ${escapeHtml(
          achievement.description
        )}

      </div>


      <div class="achievement-progress">

        <span>
          ${progressText}
        </span>

        <span>
          ${percent}%
        </span>

      </div>


      <div class="achievement-progress-bar">

        <div
          class="achievement-progress-fill"
          style="width:${percent}%"
        ></div>

      </div>

    `;


    container.appendChild(
      card
    );

  }


  if (
    container.children.length === 0
  ) {

    container.innerHTML = `

      <div class="message">

        No achievements in this category.

      </div>

    `;

  }

}


/* =====================================================
   FILTER
===================================================== */

function setFilter(
  filter,
  button
) {

  currentFilter =
    filter;


  document
    .querySelectorAll(
      ".filter"
    )
    .forEach(
      function(element) {

        element
          .classList
          .remove(
            "active"
          );

      }
    );


  button
    .classList
    .add(
      "active"
    );


  renderAchievements();

}


/* =====================================================
   SHOW MESSAGE
===================================================== */

function showMessage(
  message,
  error
) {

  const element =
    document.getElementById(
      "message"
    );


  element
    .style
    .display =
      "block";


  element
    .className =
      error
        ? "message error"
        : "message";


  element
    .textContent =
      message;

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(
  value
) {

  return String(
    value || ""
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );

}


/* =====================================================
   LOAD USER FROM URL
===================================================== */

function loadUserFromUrl() {

  const params =
    new URLSearchParams(
      window.location.search
    );


  const username =
    params.get(
      "user"
    );


  if (username) {

    document
      .getElementById(
        "usernameInput"
      )
      .value =
        username;


    loadPlayer(
      username
    );

  }

}


/* =====================================================
   START
===================================================== */

loadUserFromUrl();

</script>

</body>

</html>
