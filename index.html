<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Twitch Economy</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #0e0e10;
  color: white;
  font-family: Arial, sans-serif;
}

.container {
  width: 100%;
  max-width: 700px;
  margin: auto;
  padding: 18px;
}

.header {
  text-align: center;
  margin-bottom: 25px;
}

.header h1 {
  margin: 0;
  font-size: 28px;
}

.header p {
  color: #aaa;
  margin-top: 8px;
}

.search {
  position: relative;
  margin-bottom: 20px;
}

input {
  width: 100%;
  padding: 15px;
  border-radius: 12px;
  border: 1px solid #333;
  background: #18181b;
  color: white;
  font-size: 16px;
  outline: none;
}

input:focus {
  border-color: #9147ff;
}

.suggestions {
  position: absolute;
  top: 54px;
  left: 0;
  right: 0;
  background: #18181b;
  border: 1px solid #333;
  border-radius: 10px;
  overflow: hidden;
  z-index: 10;
}

.suggestion {
  padding: 13px;
  cursor: pointer;
}

.suggestion:hover {
  background: #27272a;
}

.player {
  display: none;
}

.card {
  background: #18181b;
  border-radius: 14px;
  padding: 18px;
  margin-bottom: 12px;
}

.player-name {
  font-size: 24px;
  font-weight: bold;
}

.stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin-top: 15px;
}

.stat {
  background: #27272a;
  border-radius: 10px;
  padding: 12px;
  text-align: center;
}

.number {
  font-size: 21px;
  font-weight: bold;
}

.label {
  color: #999;
  font-size: 11px;
  margin-top: 5px;
}

.achievement {
  padding: 14px;
  background: #18181b;
  border-radius: 10px;
  margin-bottom: 8px;
  border-left: 5px solid #444;
}

.completed {
  border-left-color: #9147ff;
}

.locked {
  opacity: 0.45;
}

.achievement-name {
  font-weight: bold;
}

.description {
  color: #999;
  font-size: 13px;
  margin-top: 5px;
}

.loading {
  text-align: center;
  color: #aaa;
  padding: 30px;
}

.error {
  background: #3f1d1d;
  color: #ff9999;
  padding: 15px;
  border-radius: 10px;
  display: none;
}

@media (max-width: 600px) {

  .container {
    padding: 12px;
  }

  .stats {
    grid-template-columns: 1fr;
  }

  .header h1 {
    font-size: 24px;
  }

}

</style>
</head>

<body>

<div class="container">

  <div class="header">

    <h1>🏆 Twitch Economy</h1>

    <p>
      Search your username to view your economy stats
    </p>

  </div>


  <div class="search">

    <input
      id="search"
      type="text"
      placeholder="Search username..."
      autocomplete="off"
    >

    <div
      id="suggestions"
      class="suggestions"
      style="display:none;"
    ></div>

  </div>


  <div
    id="error"
    class="error"
  ></div>


  <div
    id="loading"
    class="loading"
  >
    Loading players...
  </div>


  <div
    id="player"
    class="player"
  >

    <div class="card">

      <div
        id="playerName"
        class="player-name"
      ></div>


      <div class="stats">

        <div class="stat">

          <div
            id="balance"
            class="number"
          >
            $0
          </div>

          <div class="label">
            BALANCE
          </div>

        </div>


        <div class="stat">

          <div
            id="moneyRank"
            class="number"
          >
            #-
          </div>

          <div class="label">
            MONEY RANK
          </div>

        </div>


        <div class="stat">

          <div
            id="achievementRank"
            class="number"
          >
            #-
          </div>

          <div class="label">
            ACHIEVEMENT RANK
          </div>

        </div>

      </div>


      <div class="stats">

        <div class="stat">

          <div
            id="completed"
            class="number"
          >
            0
          </div>

          <div class="label">
            ACHIEVEMENTS
          </div>

        </div>


        <div class="stat">

          <div
            id="total"
            class="number"
          >
            0
          </div>

          <div class="label">
            TOTAL
          </div>

        </div>


        <div class="stat">

          <div
            id="percentage"
            class="number"
          >
            0%
          </div>

          <div class="label">
            COMPLETION
          </div>

        </div>

      </div>

    </div>


    <div
      id="achievements"
    ></div>

  </div>

</div>


<script>

const DATA_URL = "players.json";

let data = null;

let players = [];


const search =
  document.getElementById("search");

const suggestions =
  document.getElementById("suggestions");

const loading =
  document.getElementById("loading");

const error =
  document.getElementById("error");

const player =
  document.getElementById("player");


/* ==========================================
   LOAD DATA
========================================== */

fetch(DATA_URL + "?t=" + Date.now())

  .then(function(response) {

    if (!response.ok) {

      throw new Error(
        "Could not load players.json"
      );

    }

    return response.json();

  })

  .then(function(json) {

    data = json;

    players =
      data.players || [];

    loading.style.display =
      "none";

  })

  .catch(function(err) {

    loading.style.display =
      "none";

    error.style.display =
      "block";

    error.textContent =
      "Unable to load player data.";

    console.error(err);

  });


/* ==========================================
   SEARCH
========================================== */

search.addEventListener(
  "input",
  function() {

    const value =
      search.value
        .trim()
        .toLowerCase();


    suggestions.innerHTML = "";


    if (!value) {

      suggestions.style.display =
        "none";

      return;

    }


    const matches =
      players
        .filter(function(p) {

          return p.username
            .toLowerCase()
            .includes(value);

        })
        .slice(0, 8);


    if (!matches.length) {

      suggestions.style.display =
        "none";

      return;

    }


    matches.forEach(
      function(p) {

        const div =
          document.createElement(
            "div"
          );

        div.className =
          "suggestion";

        div.textContent =
          p.username;


        div.addEventListener(
          "click",
          function() {

            search.value =
              p.username;

            suggestions.style.display =
              "none";

            showPlayer(p.username);

          }
        );


        suggestions.appendChild(div);

      }
    );


    suggestions.style.display =
      "block";

  }
);


/* ==========================================
   SHOW PLAYER
========================================== */

function showPlayer(username) {

  const found =
    players.find(
      function(p) {

        return p.username
          .toLowerCase() ===
          username.toLowerCase();

      }
    );


  if (!found) {

    player.style.display =
      "none";

    error.style.display =
      "block";

    error.textContent =
      "Player not found.";

    return;

  }


  error.style.display =
    "none";

  player.style.display =
    "block";


  document.getElementById(
    "playerName"
  ).textContent =
    found.username;


  document.getElementById(
    "balance"
  ).textContent =
    "$" +
    Number(found.balance)
      .toLocaleString();


  document.getElementById(
    "moneyRank"
  ).textContent =
    "#" +
    found.moneyRank +
    "/" +
    data.totalPlayers;


  document.getElementById(
    "achievementRank"
  ).textContent =
    "#" +
    found.achievementRank +
    "/" +
    data.totalPlayers;


  document.getElementById(
    "completed"
  ).textContent =
    found.achievementCount;


  document.getElementById(
    "total"
  ).textContent =
    data.totalAchievements;


  const percentage =
    data.totalAchievements > 0
      ? Math.round(
          found.achievementCount /
          data.totalAchievements *
          100
        )
      : 0;


  document.getElementById(
    "percentage"
  ).textContent =
    percentage + "%";


  const achievementContainer =
    document.getElementById(
      "achievements"
    );


  achievementContainer.innerHTML =
    "";


  if (
    found.achievements &&
    found.achievements.length
  ) {

    data.players
      .find(
        function(p) {
          return p.username ===
            found.username;
        }
      );

  }


  /*
     We don't need the full achievement
     definitions from GitHub here.
     The achievement IDs stored in
     players.json are enough to mark
     completed achievements.
  */


  const completedIDs =
    found.achievements || [];


  /*
     Build achievement list from the
     definitions included in the JSON.
  */


  if (
    data.achievements &&
    data.achievements.length
  ) {

    data.achievements.forEach(
      function(a) {

        const isComplete =
          completedIDs.indexOf(
            a.id
          ) !== -1;


        const div =
          document.createElement(
            "div"
          );


        div.className =
          "achievement " +
          (
            isComplete
              ? "completed"
              : "locked"
          );


        div.innerHTML =

          "<div class='achievement-name'>" +

          (
            isComplete
              ? "✅ "
              : "🔒 "
          ) +

          escapeHTML(a.name) +

          "</div>" +

          "<div class='description'>" +

          escapeHTML(a.description) +

          "</div>";


        achievementContainer
          .appendChild(div);

      }
    );

  }

}


/* ==========================================
   HTML ESCAPE
========================================== */

function escapeHTML(value) {

  return String(value)

    .replace(/&/g, "&amp;")

    .replace(/</g, "&lt;")

    .replace(/>/g, "&gt;")

    .replace(/"/g, "&quot;")

    .replace(/'/g, "&#039;");

}


/* ==========================================
   CLOSE SUGGESTIONS
========================================== */

document.addEventListener(
  "click",
  function(event) {

    if (
      !event.target.closest(
        ".search"
      )
    ) {

      suggestions.style.display =
        "none";

    }

  }
);

</script>

</body>
</html>
