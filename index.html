<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Twitch Economy</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #0e0e10;
  color: white;
  font-family: Arial, sans-serif;
}

.container {
  max-width: 700px;
  margin: auto;
  padding: 16px;
}

.header {
  text-align: center;
  margin-bottom: 20px;
}

.header h1 {
  margin: 0;
  font-size: 27px;
}

.header p {
  color: #999;
}

.search {
  position: relative;
  margin-bottom: 20px;
}

input {
  width: 100%;
  padding: 15px;
  background: #18181b;
  color: white;
  border: 1px solid #333;
  border-radius: 12px;
  font-size: 16px;
  outline: none;
}

input:focus {
  border-color: #9147ff;
}

.suggestions {
  position: absolute;
  left: 0;
  right: 0;
  top: 55px;
  background: #18181b;
  border: 1px solid #333;
  border-radius: 10px;
  overflow: hidden;
  z-index: 100;
}

.suggestion {
  padding: 13px;
  cursor: pointer;
}

.suggestion:hover {
  background: #27272a;
}

.loading {
  text-align: center;
  color: #aaa;
  padding: 30px;
}

.error {
  display: none;
  background: #3b1717;
  color: #ff9999;
  padding: 14px;
  border-radius: 10px;
  margin-bottom: 15px;
}

.player {
  display: none;
}

.card {
  background: #18181b;
  border-radius: 14px;
  padding: 18px;
  margin-bottom: 14px;
}

.player-name {
  font-size: 24px;
  font-weight: bold;
  margin-bottom: 15px;
}

.stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin-top: 8px;
}

.stat {
  background: #27272a;
  border-radius: 10px;
  padding: 12px;
  text-align: center;
}

.number {
  font-size: 20px;
  font-weight: bold;
}

.label {
  color: #999;
  font-size: 10px;
  margin-top: 5px;
}

.section-title {
  font-size: 20px;
  font-weight: bold;
  margin: 18px 0 10px;
}

.achievement {
  background: #18181b;
  border-radius: 10px;
  padding: 14px;
  margin-bottom: 8px;
  border-left: 5px solid #444;
}

.achievement.completed {
  border-left-color: #9147ff;
}

.achievement.locked {
  opacity: 0.45;
}

.achievement-name {
  font-weight: bold;
  font-size: 15px;
}

.description {
  color: #999;
  font-size: 13px;
  margin-top: 5px;
}

@media(max-width:600px) {
  .container {
    padding: 12px;
  }

  .stats {
    grid-template-columns: 1fr;
  }
}
</style>
</head>

<body>

<div class="container">

  <div class="header">
    <h1>🏆 Twitch Economy</h1>
    <p>Search your username</p>
  </div>

  <div class="search">

    <input
      id="search"
      type="text"
      placeholder="Search username..."
      autocomplete="off"
    >

    <div
      id="suggestions"
      class="suggestions"
      style="display:none;"
    ></div>

  </div>

  <div id="error" class="error"></div>

  <div id="loading" class="loading">
    Loading players...
  </div>

  <div id="player" class="player">

    <div class="card">

      <div id="playerName" class="player-name"></div>

      <div class="stats">

        <div class="stat">
          <div id="balance" class="number">$0</div>
          <div class="label">BALANCE</div>
        </div>

        <div class="stat">
          <div id="moneyRank" class="number">#-</div>
          <div class="label">MONEY RANK</div>
        </div>

        <div class="stat">
          <div id="achievementRank" class="number">#-</div>
          <div class="label">ACHIEVEMENT RANK</div>
        </div>

      </div>

      <div class="stats">

        <div class="stat">
          <div id="completed" class="number">0</div>
          <div class="label">COMPLETED</div>
        </div>

        <div class="stat">
          <div id="total" class="number">0</div>
          <div class="label">TOTAL</div>
        </div>

        <div class="stat">
          <div id="percentage" class="number">0%</div>
          <div class="label">COMPLETION</div>
        </div>

      </div>

    </div>

    <div class="section-title">
      🏆 Achievements
    </div>

    <div id="achievements"></div>

  </div>

</div>


<script>

var DATA_URL = "players.json";

var data = null;
var players = [];

var search =
  document.getElementById("search");

var suggestions =
  document.getElementById("suggestions");

var loading =
  document.getElementById("loading");

var error =
  document.getElementById("error");

var player =
  document.getElementById("player");


/* ==========================================
   LOAD JSON
========================================== */

fetch(
  DATA_URL + "?v=" + Date.now(),
  {
    cache: "no-store"
  }
)

.then(function(response) {

  if (!response.ok) {
    throw new Error(
      "players.json could not be loaded."
    );
  }

  return response.json();

})

.then(function(json) {

  data = json;

  players =
    Array.isArray(data.players)
      ? data.players
      : [];

  loading.style.display = "none";

  console.log(
    "Loaded players:",
    players.length
  );

  console.log(
    "Achievements:",
    data.achievements
  );

})

.catch(function(err) {

  loading.style.display = "none";

  error.style.display = "block";

  error.textContent =
    "Unable to load player data.";

  console.error(err);

});


/* ==========================================
   SEARCH
========================================== */

search.addEventListener(
  "input",
  function() {

    var value =
      search.value
        .trim()
        .toLowerCase();

    suggestions.innerHTML = "";

    if (!value) {

      suggestions.style.display =
        "none";

      return;

    }

    var matches =
      players
        .filter(function(p) {

          return String(p.username)
            .toLowerCase()
            .includes(value);

        })
        .slice(0, 8);


    if (!matches.length) {

      suggestions.style.display =
        "none";

      return;

    }


    matches.forEach(function(p) {

      var div =
        document.createElement("div");

      div.className =
        "suggestion";

      div.textContent =
        p.username;


      div.onclick =
        function() {

          search.value =
            p.username;

          suggestions.style.display =
            "none";

          showPlayer(p.username);

        };


      suggestions.appendChild(div);

    });


    suggestions.style.display =
      "block";

  }
);


/* ==========================================
   SHOW PLAYER
========================================== */

function showPlayer(username) {

  var found =
    players.find(function(p) {

      return String(p.username)
        .toLowerCase() ===
        String(username)
          .toLowerCase();

    });


  if (!found) {

    player.style.display =
      "none";

    error.style.display =
      "block";

    error.textContent =
      "Player not found.";

    return;

  }


  error.style.display =
    "none";

  player.style.display =
    "block";


  document.getElementById(
    "playerName"
  ).textContent =
    found.username;


  document.getElementById(
    "balance"
  ).textContent =
    "$" +
    Number(found.balance || 0)
      .toLocaleString();


  document.getElementById(
    "moneyRank"
  ).textContent =
    "#" +
    (found.moneyRank || "-") +
    "/" +
    (data.totalPlayers || players.length);


  document.getElementById(
    "achievementRank"
  ).textContent =
    "#" +
    (found.achievementRank || "-") +
    "/" +
    (data.totalPlayers || players.length);


  document.getElementById(
    "completed"
  ).textContent =
    found.achievementCount || 0;


  document.getElementById(
    "total"
  ).textContent =
    data.totalAchievements || 0;


  var total =
    Number(data.totalAchievements || 0);

  var count =
    Number(found.achievementCount || 0);

  var percentage =
    total > 0
      ? Math.round(count / total * 100)
      : 0;


  document.getElementById(
    "percentage"
  ).textContent =
    percentage + "%";


  renderAchievements(found);

}


/* ==========================================
   RENDER ACHIEVEMENTS
========================================== */

function renderAchievements(found) {

  var container =
    document.getElementById(
      "achievements"
    );

  container.innerHTML = "";


  var definitions =
    Array.isArray(data.achievements)
      ? data.achievements
      : [];


  var completedIDs =
    Array.isArray(found.achievements)
      ? found.achievements
      : [];


  /*
    Make the completed IDs easier to check.
  */

  var completedMap = {};

  completedIDs.forEach(function(id) {

    completedMap[String(id).trim()] =
      true;

  });


  /*
    Create every achievement.
  */

  definitions.forEach(function(a) {

    var id =
      String(a.id).trim();

    var isComplete =
      completedMap[id] === true;


    var div =
      document.createElement("div");


    div.className =
      "achievement " +
      (
        isComplete
          ? "completed"
          : "locked"
      );


    var name =
      document.createElement("div");

    name.className =
      "achievement-name";


    name.textContent =
      (
        isComplete
          ? "✅ "
          : "🔒 "
      ) +
      a.name;


    var description =
      document.createElement("div");

    description.className =
      "description";

    description.textContent =
      a.description;


    div.appendChild(name);

    div.appendChild(description);

    container.appendChild(div);

  });


  /*
    If no definitions were included
    in players.json, tell us why.
  */

  if (!definitions.length) {

    var message =
      document.createElement("div");

    message.className =
      "achievement locked";

    message.textContent =
      "Achievement definitions were not found in players.json.";

    container.appendChild(message);

  }

}


/* ==========================================
   HIDE SUGGESTIONS
========================================== */

document.addEventListener(
  "click",
  function(event) {

    if (
      !event.target.closest(".search")
    ) {

      suggestions.style.display =
        "none";

    }

  }
);

</script>

</body>
</html>
