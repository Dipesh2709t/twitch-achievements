<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Twitch Achievements</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    background: #0f0f12;
    color: #ffffff;
    font-family: Arial, Helvetica, sans-serif;
}

.container {
    width: 100%;
    max-width: 900px;
    margin: auto;
}

.header {
    background: #18181b;
    border-radius: 16px;
    padding: 22px;
    margin-bottom: 18px;
}

h1 {
    margin: 0 0 8px 0;
    font-size: 28px;
}

.subtitle {
    color: #aaa;
}

.stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-top: 18px;
}

.stat {
    background: #242429;
    padding: 15px;
    border-radius: 12px;
    text-align: center;
}

.stat-number {
    font-size: 22px;
    font-weight: bold;
}

.stat-label {
    color: #aaa;
    font-size: 13px;
    margin-top: 4px;
}

.achievement {
    background: #18181b;
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 10px;
    border-left: 5px solid #444;
}

.completed {
    border-left-color: #9147ff;
}

.locked {
    opacity: 0.65;
}

.achievement-title {
    font-size: 17px;
    font-weight: bold;
}

.description {
    color: #bbb;
    margin-top: 5px;
}

.progress {
    margin-top: 10px;
    color: #aaa;
    font-size: 14px;
}

.badge {
    display: inline-block;
    padding: 4px 8px;
    border-radius: 8px;
    font-size: 12px;
    margin-left: 6px;
    background: #9147ff;
}

.search {
    width: 100%;
    padding: 13px;
    margin-bottom: 15px;
    border: none;
    border-radius: 10px;
    background: #242429;
    color: white;
    font-size: 16px;
}

@media (max-width: 600px) {

    body {
        padding: 10px;
    }

    h1 {
        font-size: 23px;
    }

    .stats {
        grid-template-columns: 1fr;
    }

    .header {
        padding: 17px;
    }

}

</style>
</head>

<body>

<div class="container">

<div class="header">

<h1 id="username">🏆 Achievements</h1>

<div class="subtitle">
Twitch Economy Achievement Profile
</div>

<div class="stats">

<div class="stat">
<div class="stat-number" id="completed">-</div>
<div class="stat-label">Completed</div>
</div>

<div class="stat">
<div class="stat-number" id="rank">-</div>
<div class="stat-label">Achievement Rank</div>
</div>

<div class="stat">
<div class="stat-number" id="percentage">-</div>
<div class="stat-label">Completion</div>
</div>

</div>

</div>

<input
class="search"
id="search"
placeholder="Search achievements..."
oninput="filterAchievements()"
>

<div id="achievements"></div>

</div>


<script>

/*
    Your Google Apps Script URL
*/

const API =
"https://script.google.com/macros/s/AKfycbyR4bHCR53b_YaZ-JWMXUkYfz4knsp2jVMaA2vceFEGnv0PMjsVYW3euc_jyMvhHPkY/exec";


/*
    Achievement definitions.
*/

const achievements = [

["First Paycheck","Use !work once.","work_count",1],
["Part-Time Employee","Use !work 25 times.","work_count",25],
["Full-Time Employee","Use !work 100 times.","work_count",100],
["Work Machine","Use !work 250 times.","work_count",250],
["Workaholic","Use !work 500 times.","work_count",500],
["Corporate Slave","Use !work 1,000 times.","work_count",1000],

["Overtime","Earn $1,000 from !work.","work_earnings",1000],
["Career Employee","Earn $5,000 from !work.","work_earnings",5000],
["Workaholic Deluxe","Earn $10,000 from !work.","work_earnings",10000],

["First Scam","Successfully scam someone.","scam_count",1],
["Rookie Scammer","Successfully scam 10 people.","scam_count",10],
["Con Artist","Successfully scam 25 people.","scam_count",25],
["Scam Factory","Successfully scam 100 people.","scam_count",100],
["Professional Criminal","Successfully scam 250 people.","scam_count",250],

["Dirty Business","Steal $1,000 through scams.","scam_earnings",1000],
["Scam Tycoon","Steal $10,000 through scams.","scam_earnings",10000],

["Big Score","Successfully scam $100 in one attempt.","big_score",1],

["Caught in 4K","Get reported once.","reports",1],
["Repeat Offender","Get reported 10 times.","reports",10],
["Public Enemy","Get reported 50 times.","reports",50],

["Rock Bottom","Reach a negative balance.","negative",1],
["Comeback Kid","Recover from negative to $200+.","comeback",1],

["Getting Rich","Reach $500.","highest_balance",500],
["Big Money","Reach $1,000.","highest_balance",1000],
["High Roller","Reach $5,000.","highest_balance",5000],

["Top 5","Reach the top 5.","top_rank",5],
["Money King","Reach #1.","top_rank",1],

["Lucky Worker","Receive a $50 lucky payout.","lucky_50",1],
["Very Lucky","Receive a $100 lucky payout.","lucky_100",1],
["Jackpot!","Hit the $150 work jackpot.","jackpot",1]

];


let currentData = null;


/*
    Get username from URL.
*/

const params =
new URLSearchParams(window.location.search);

const user =
(params.get("user") || "test")
.toLowerCase();


/*
    Load player information.
*/

async function loadPlayer() {

    try {

        const response =
        await fetch(
            API +
            "?action=player&user=" +
            encodeURIComponent(user)
        );

        const data =
        await response.json();

        currentData = data;

        render(data);

    }

    catch(error) {

        document.getElementById(
            "achievements"
        ).innerHTML =
        "<div class='achievement locked'>" +
        "Unable to load achievement data." +
        "</div>";

    }

}


/*
    Render page.
*/

function render(data) {

    document.getElementById(
        "username"
    ).textContent =
    "🏆 " + user + "'s Achievements";


    const completed =
    data.completed || 0;

    const total =
    achievements.length;


    document.getElementById(
        "completed"
    ).textContent =
    completed + "/" + total;


    document.getElementById(
        "rank"
    ).textContent =
    "#" + (data.rank || "-");


    document.getElementById(
        "percentage"
    ).textContent =
    Math.round(
        completed / total * 100
    ) + "%";


    const container =
    document.getElementById(
        "achievements"
    );


    container.innerHTML = "";


    achievements.forEach(
    function(a, index) {

        const completed =
        data.achievements &&
        data.achievements[index];


        const div =
        document.createElement(
            "div"
        );


        div.className =
        "achievement " +
        (completed
            ? "completed"
            : "locked");


        div.dataset.name =
        a[0].toLowerCase();


        div.innerHTML =

        "<div class='achievement-title'>" +

        (completed ? "✅ " : "🔒 ") +

        a[0] +

        (completed
            ? "<span class='badge'>COMPLETED</span>"
            : "") +

        "</div>" +

        "<div class='description'>" +
        a[1] +
        "</div>";


        container.appendChild(div);

    });

}


/*
    Search.
*/

function filterAchievements() {

    const query =
    document.getElementById(
        "search"
    ).value.toLowerCase();


    document
    .querySelectorAll(
        ".achievement"
    )
    .forEach(
    function(item) {

        item.style.display =
        item.dataset.name
        .includes(query)
        ? "block"
        : "none";

    });

}


loadPlayer();

</script>

</body>
</html>
