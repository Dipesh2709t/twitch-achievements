<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Twitch Achievements</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 12px;
    background: #0e0e10;
    color: #fff;
    font-family: Arial, sans-serif;
}

.container {
    max-width: 800px;
    margin: auto;
}

.card {
    background: #18181b;
    border-radius: 14px;
    padding: 18px;
    margin-bottom: 12px;
}

h1 {
    margin: 0 0 5px;
    font-size: 24px;
}

.subtitle {
    color: #aaa;
}

.stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-top: 18px;
}

.stat {
    background: #27272a;
    padding: 12px;
    border-radius: 10px;
    text-align: center;
}

.stat-number {
    font-size: 21px;
    font-weight: bold;
}

.stat-label {
    color: #aaa;
    font-size: 12px;
    margin-top: 4px;
}

.achievement {
    background: #18181b;
    border-radius: 11px;
    padding: 14px;
    margin-bottom: 8px;
    border-left: 5px solid #444;
}

.completed {
    border-left-color: #9147ff;
}

.locked {
    opacity: .55;
}

.achievement-name {
    font-weight: bold;
    font-size: 16px;
}

.description {
    color: #aaa;
    font-size: 13px;
    margin-top: 5px;
}

.loading {
    text-align: center;
    color: #aaa;
    padding: 40px 10px;
}

.error {
    background: #351717;
    color: #ff9999;
    padding: 18px;
    border-radius: 10px;
}

@media (max-width: 600px) {

    body {
        padding: 8px;
    }

    .stats {
        grid-template-columns: 1fr;
    }

    h1 {
        font-size: 21px;
    }

}

</style>
</head>

<body>

<div class="container">

    <div class="card">

        <h1 id="username">
            🏆 Loading...
        </h1>

        <div class="subtitle">
            Twitch Economy Achievements
        </div>

        <div class="stats">

            <div class="stat">
                <div class="stat-number" id="completed">-</div>
                <div class="stat-label">
                    Completed
                </div>
            </div>

            <div class="stat">
                <div class="stat-number" id="rank">-</div>
                <div class="stat-label">
                    Achievement Rank
                </div>
            </div>

            <div class="stat">
                <div class="stat-number" id="percentage">-</div>
                <div class="stat-label">
                    Completion
                </div>
            </div>

        </div>

    </div>

    <div id="achievements">

        <div class="loading">
            Loading achievements...
        </div>

    </div>

</div>


<script>

/* YOUR GOOGLE APPS SCRIPT */

const API =
"https://script.google.com/macros/s/AKfycbyR4bHCR53b_YaZ-JWMXUkYfz4knsp2jVMaA2vceFEGnv0PMjsVYW3euc_jyMvhHPkY/exec";


/* ACHIEVEMENTS */

const ACHIEVEMENTS = [

["First Paycheck", "Use !work once."],
["Part-Time Employee", "Use !work 25 times."],
["Full-Time Employee", "Use !work 100 times."],
["Work Machine", "Use !work 250 times."],
["Workaholic", "Use !work 500 times."],
["Corporate Slave", "Use !work 1,000 times."],

["Overtime", "Earn $1,000 from !work."],
["Career Employee", "Earn $5,000 from !work."],
["Workaholic Deluxe", "Earn $10,000 from !work."],

["First Scam", "Successfully scam someone."],
["Rookie Scammer", "Successfully scam 10 people."],
["Con Artist", "Successfully scam 25 people."],
["Scam Factory", "Successfully scam 100 people."],
["Professional Criminal", "Successfully scam 250 people."],

["Dirty Business", "Steal $1,000 through scams."],
["Scam Tycoon", "Steal $10,000 through scams."],

["Big Score", "Successfully scam $100 in one attempt."],

["Caught in 4K", "Get reported once."],
["Repeat Offender", "Get reported 10 times."],
["Public Enemy", "Get reported 50 times."],

["Rock Bottom", "Reach a negative balance."],
["Comeback Kid", "Recover from negative balance to $200+."],

["Getting Rich", "Reach $500."],
["Big Money", "Reach $1,000."],
["High Roller", "Reach $5,000."],

["Top 5", "Reach the top 5."],
["Money King", "Reach #1."],

["Lucky Worker", "Receive a $50 lucky payout."],
["Very Lucky", "Receive a $100 lucky payout."],
["Jackpot!", "Hit the $150 work jackpot."]

];


/* GET USER FROM URL */

const params =
new URLSearchParams(
    window.location.search
);

const user =
(
    params.get("user") ||
    "test"
).trim();


/* ESCAPE HTML */

function escapeHTML(text) {

    return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* LOAD */

function loadAchievements() {

    const url =
        API +
        "?action=player&user=" +
        encodeURIComponent(user);


    fetch(url)

        .then(function(response) {

            if (!response.ok) {

                throw new Error(
                    "Server returned " +
                    response.status
                );

            }

            return response.json();

        })

        .then(function(data) {

            console.log(data);

            if (data.error) {

                throw new Error(
                    data.error
                );

            }

            showData(data);

        })

        .catch(function(error) {

            console.error(error);

            document.getElementById(
                "achievements"
            ).innerHTML =

                "<div class='error'>" +

                "❌ Unable to load achievements.<br><br>" +

                escapeHTML(
                    error.message
                ) +

                "<br><br>" +

                "Try refreshing the page."

                +

                "</div>";

        });

}


/* DISPLAY */

function showData(data) {

    const completed =
        Number(data.completed || 0);

    const total =
        Number(
            data.total ||
            ACHIEVEMENTS.length
        );

    const rank =
        data.rank || "-";

    const percentage =
        Math.round(
            completed /
            total *
            100
        );


    document.getElementById(
        "username"
    ).textContent =

        "🏆 " +
        escapeHTML(
            data.username
        ) +
        "'s Achievements";


    document.getElementById(
        "completed"
    ).textContent =

        completed +
        "/" +
        total;


    document.getElementById(
        "rank"
    ).textContent =

        rank === "-"
            ? "-"
            : "#" + rank;


    document.getElementById(
        "percentage"
    ).textContent =

        percentage + "%";


    const states =
        data.achievements || [];


    let html = "";


    ACHIEVEMENTS.forEach(
        function(achievement, index) {

            const done =
                states[index] === true;


            html +=

                "<div class='achievement " +

                (
                    done
                        ? "completed"
                        : "locked"
                ) +

                "'>" +

                "<div class='achievement-name'>" +

                (
                    done
                        ? "✅ "
                        : "🔒 "
                ) +

                escapeHTML(
                    achievement[0]
                ) +

                "</div>" +

                "<div class='description'>" +

                escapeHTML(
                    achievement[1]
                ) +

                "</div>" +

                "</div>";

        }
    );


    document.getElementById(
        "achievements"
    ).innerHTML = html;

}


/* START */

loadAchievements();

</script>

</body>
</html>
